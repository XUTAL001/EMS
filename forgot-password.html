<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Neumorphic Soft UI Forgot & Reset Password Page with animated recovery steps.">
  <title>Reset Password — Neumorphic Soft UI</title>
  
  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient Mode Switcher -->
  <div class="top-controls">
    <button id="theme-toggle" class="neu-circle-btn theme-btn" title="Toggle Dark/Light Soft UI" aria-label="Toggle Theme">
      <svg id="theme-icon-sun" class="theme-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg id="theme-icon-moon" class="theme-icon hidden" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
  </div>

  <!-- Neumorphic Card Container -->
  <div class="neu-card-wrapper">
    <div class="neu-card" id="forgot-card">
      
      <!-- Top Neumorphic Icon Badge: Key / Recovery Icon -->
      <div class="neu-top-badge-wrap">
        <div class="neu-icon-badge" id="icon-badge">
          <!-- Key / Reset SVG -->
          <svg id="icon-key" class="badge-svg active" viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#0070f3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 2l-2 2m-1.5 1.5L12 11"></path>
            <path d="M15.5 7.5L17 9"></path>
            <path d="M13 10l1.5 1.5"></path>
            <circle cx="7.5" cy="16.5" r="4.5"></circle>
          </svg>
          <!-- Mail Sent SVG for Step 2 -->
          <svg id="icon-sent" class="badge-svg" viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#0070f3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 2L11 13"></path>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </div>
      </div>

      <!-- Header Titles -->
      <div class="auth-header">
        <h1 class="auth-title" id="forgot-title">Reset Password</h1>
        <p class="auth-subtitle" id="forgot-subtitle">Enter your email address and we'll send you recovery instructions</p>
      </div>

      <!-- Step 1: Email Submission Form -->
      <form id="forgot-form" class="auth-form" novalidate>
        <div class="neu-input-group">
          <input 
            type="email" 
            id="forgot-email-input" 
            class="neu-input" 
            placeholder="Email Address" 
            autocomplete="email"
            required
          >
        </div>

        <button type="submit" id="btn-send-reset" class="neu-btn">
          <span id="btn-reset-text">Send Reset Link</span>
        </button>
      </form>

      <!-- Step 2: Verification Code State (Initially Hidden, Smooth Reveal) -->
      <div id="otp-step-container" class="otp-container hidden">
        <p class="otp-instructions">Enter the 4-digit verification code sent to your email:</p>
        
        <div class="otp-inputs-row">
          <input type="text" maxlength="1" class="neu-input otp-digit" inputmode="numeric" pattern="[0-9]*">
          <input type="text" maxlength="1" class="neu-input otp-digit" inputmode="numeric" pattern="[0-9]*">
          <input type="text" maxlength="1" class="neu-input otp-digit" inputmode="numeric" pattern="[0-9]*">
          <input type="text" maxlength="1" class="neu-input otp-digit" inputmode="numeric" pattern="[0-9]*">
        </div>

        <button type="button" id="btn-verify-otp" class="neu-btn">
          <span>Verify & Continue</span>
        </button>

        <div class="resend-row">
          <span id="resend-timer-text">Resend code in <strong id="resend-countdown">45</strong>s</span>
          <button type="button" id="btn-resend-code" class="text-link-btn hidden">Resend Code</button>
        </div>
      </div>

      <!-- Back to Login Navigation -->
      <div class="back-login-row">
        <a href="index.html" class="back-link">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Back to Login</span>
        </a>
      </div>

    </div>
  </div>

  <!-- Toast Notification Center -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Script -->
  <script src="script.js"></script>
</body>
</html>
