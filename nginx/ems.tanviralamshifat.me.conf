# ==============================================================================
# NGINX VIRTUAL HOST CONFIGURATION
# Production Subdomain: ems.tanviralamshifat.me
# Preserves main domain tanviralamshifat.me & www.tanviralamshifat.me on Vercel
# ==============================================================================

# 1. Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ems.tanviralamshifat.me;

    # Certbot ACME Challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Production HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ems.tanviralamshifat.me;

    # SSL Certificates (managed via Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/ems.tanviralamshifat.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ems.tanviralamshifat.me/privkey.pem;

    # Modern SSL Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # File Upload Limits
    client_max_body_size 10M;

    # Proxy to NexusEMS Application Server (Port 8080)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
