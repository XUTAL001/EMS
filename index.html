<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Company Portal — Neumorphic Soft UI Login with secure authentication and password reveal.">
  <title>Company Portal — Login</title>
  
  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient Mode Switcher -->
  <div class="top-controls">
    <button id="theme-toggle" class="neu-circle-btn theme-btn" title="Toggle Dark/Light Soft UI" aria-label="Toggle Theme">
      <svg id="theme-icon-sun" class="theme-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg id="theme-icon-moon" class="theme-icon hidden" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
  </div>

  <!-- Neumorphic Card Container -->
  <div class="neu-card-wrapper">
    <div class="neu-card" id="auth-card">
      
      <!-- Top Neumorphic Icon Badge -->
      <div class="neu-top-badge-wrap">
        <div class="neu-icon-badge" id="icon-badge">
          <!-- Lock Icon for Company Portal -->
          <svg id="icon-lock" class="badge-svg active" viewBox="0 0 24 24" width="32" height="32" fill="#0070f3" stroke="#0070f3" stroke-width="1.5">
            <rect x="3" y="11" width="18" height="11" rx="2.5" ry="2.5"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4" fill="none" stroke="#0070f3" stroke-width="2.5" stroke-linecap="round"></path>
          </svg>
        </div>
      </div>

      <!-- Header Titles -->
      <div class="auth-header">
        <h1 class="auth-title" id="form-title">Welcome</h1>
        <p class="auth-subtitle" id="form-subtitle">Login to your company account</p>
      </div>

      <!-- Main Form -->
      <form id="auth-form" class="auth-form" novalidate>
        
        <!-- Company Email Field -->
        <div class="neu-input-group">
          <input 
            type="email" 
            id="email-input" 
            class="neu-input" 
            placeholder="Company Email Address" 
            autocomplete="email"
            required
          >
        </div>

        <!-- Password Field with Show/Hide toggle -->
        <div class="neu-input-group password-group">
          <input 
            type="password" 
            id="password-input" 
            class="neu-input" 
            placeholder="Password" 
            autocomplete="current-password"
            required
          >
          <button type="button" id="toggle-password" class="password-toggle-btn" aria-label="Toggle password visibility">
            <!-- Eye open icon -->
            <svg id="eye-icon-open" class="eye-svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <!-- Eye closed icon -->
            <svg id="eye-icon-closed" class="eye-svg hidden" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>

        <!-- Options Row: Remember Me & Forgot Password -->
        <div class="auth-options" id="auth-options-row">
          <label class="neu-checkbox-label">
            <input type="checkbox" id="remember-me-checkbox" class="neu-checkbox-native">
            <span class="neu-checkbox-box"></span>
            <span class="checkbox-text" id="remember-text">Remember me</span>
          </label>
          <a href="forgot-password.html" id="forgot-password-link" class="forgot-link">Forgot Password?</a>
        </div>

        <!-- Neumorphic Main Submit Button -->
        <button type="submit" id="btn-submit" class="neu-btn neu-btn-submit">
          <span id="btn-text">Login</span>
        </button>

        <!-- Company Access Hints -->
        <div class="demo-credential-box">
          <p class="demo-credential-hint">👔 HR Account: <strong>tanvir@gmai.com</strong> | <strong>shifat001</strong> <span class="badge-tag">HR Role</span></p>
          <p class="demo-credential-hint">💼 Manager Account: <strong>alex@company.com</strong> | <strong>manager123</strong> <span class="badge-tag mgr">Manager Role</span></p>
          <p class="demo-credential-hint">👤 Employee Account: <strong>sophia@company.com</strong> | <strong>employee123</strong> <span class="badge-tag emp">Employee Role</span></p>
        </div>
      </form>

      <!-- Neumorphic Social Login Buttons (hanging slightly at bottom) -->
      <div class="social-login-row">
        <!-- Google Workspace -->
        <button type="button" class="neu-circle-btn social-btn" title="Sign in with Google Workspace" aria-label="Google Workspace">
          <span class="social-text">G</span>
        </button>
        <!-- Facebook -->
        <button type="button" class="neu-circle-btn social-btn" title="Sign in with Enterprise SSO" aria-label="Enterprise SSO">
          <span class="social-text">f</span>
        </button>
        <!-- LinkedIn -->
        <button type="button" class="neu-circle-btn social-btn" title="Sign in with LinkedIn" aria-label="LinkedIn">
          <span class="social-text">in</span>
        </button>
      </div>

    </div>
  </div>

  <!-- Toast Notification Center -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Script -->
  <script src="script.js"></script>
</body>
</html>
